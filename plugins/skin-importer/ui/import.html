<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导入皮肤</title>
  <!-- SkinNexus · Copyright (C) 2026 SkinNexus contributors · AGPL-3.0 -->
  <style>
:root {
      color-scheme: dark;
      --plugin-bg: #101825;
      --plugin-panel: #16202e;
      --plugin-border: rgba(169, 138, 95, .24);
      --plugin-text: #e9edf1;
      --plugin-muted: #a8b4c3;
      --plugin-accent: #b0453a;
      --plugin-link: #67b7a0;
      --plugin-danger: #d9564c;
      --plugin-ok: #6fbf7d;
      --plugin-hover: rgba(233, 237, 241, .06);
    }
    * { box-sizing: border-box; }
    html { background: var(--plugin-panel); }
    body {
      margin: 0 auto; max-width: 760px; padding: 28px;
      background: var(--plugin-panel); color: var(--plugin-text);
      font-family: "Segoe UI", "Inter", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 15px; line-height: 1.65;
    }
    body.admin { max-width: 1080px; }
    h2 { margin: 0 0 8px; font-size: 22px; font-weight: 600; line-height: 1.3; }
    h3 { margin: 28px 0 10px; font-size: 17px; font-weight: 600; }
    p { margin: 0; }
    .muted { color: var(--plugin-muted); font-size: 13px; }
    label { display: block; margin-top: 14px; font-size: 14px; color: var(--plugin-muted); }
    input, select, textarea {
      width: 100%; padding: 10px 12px; margin-top: 6px;
      background: var(--plugin-bg); color: var(--plugin-text);
      border: 1px solid var(--plugin-border); border-radius: 6px; font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--plugin-link); outline-offset: 1px; }
    input[type="checkbox"] { width: auto; accent-color: var(--plugin-accent); }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }
    button { font: inherit; border-radius: 6px; cursor: pointer; }
    .primary { margin-top: 18px; background: var(--plugin-accent); color: #fff; border: 0; padding: 10px 18px; font-weight: 600; }
    .primary:disabled { opacity: .5; cursor: default; }
    .secondary { background: transparent; color: var(--plugin-text); border: 1px solid var(--plugin-border); padding: 8px 14px; }
    .secondary:hover { background: var(--plugin-hover); }
    .error { color: var(--plugin-danger); white-space: pre-wrap; margin-top: 12px; }
    .ok { color: var(--plugin-ok); white-space: pre-wrap; margin-top: 12px; }
    .result { margin-top: 14px; font-size: 14px; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 6px; margin: 18px 0 12px; }
    .tabs button { border: 1px solid var(--plugin-border); background: transparent; color: var(--plugin-muted); padding: 8px 14px; }
    .tabs button.on { border-color: var(--plugin-accent); color: var(--plugin-accent); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--plugin-border); vertical-align: top; }
    tbody tr:hover { background: var(--plugin-hover); }
    .bar { height: 8px; background: var(--plugin-bg); margin-top: 6px; border-radius: 4px; overflow: hidden; }
    .bar > i { display: block; height: 8px; background: var(--plugin-accent); }
    button.small { padding: 4px 9px; margin: 2px; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; font-size: 14px; color: var(--plugin-text); }
    .check input { width: auto; margin-top: 3px; }
    @media (max-width: 640px) {
      body { padding: 20px; }
      .row { flex-wrap: wrap; }
      .row > * { min-width: 100%; }
    }
  </style>
</head>
<body>
  <h2 data-i18n="title">导入皮肤 / 披风</h2>
  <p class="muted" data-i18n="intro">导入到你的个人纹理库；选择角色可同时应用。Mojang 会导入该账号公开的皮肤与披风。</p>

  <div class="tabs">
    <button id="tab-mojang" class="on" data-i18n="tabMojang">Mojang 正版用户名</button>
    <button id="tab-blessing" data-i18n="tabBlessing">Blessing 皮肤链接</button>
  </div>

  <div id="pane-mojang">
    <label><span data-i18n="username">正版用户名</span><input id="username" data-i18n-placeholder="usernamePlaceholder" placeholder="例如 Notch" autocomplete="off" /></label>
  </div>
  <div id="pane-blessing" class="hidden">
    <label><span data-i18n="url">皮肤详情页链接</span><input id="url" data-i18n-placeholder="urlPlaceholder" placeholder="https://站点/skinlib/show/123" autocomplete="off" /></label>
  </div>

  <div class="row">
    <label><span data-i18n="applyTo">应用到角色（可选）</span><select id="player"><option value="" data-i18n="libraryOnly">只导入纹理库</option></select></label>
  </div>

  <button id="submit" class="primary" data-i18n="submit">开始导入</button>
  <div id="msg" class="error" hidden></div>
  <div id="done" class="ok" hidden></div>
  <div id="result" class="result" hidden></div>

  <script>
function applyTheme(t) {
      if (!t) return
      const r = document.documentElement
      const map = { bg: '--plugin-bg', panel: '--plugin-panel', border: '--plugin-border',
        text: '--plugin-text', muted: '--plugin-muted', accent: '--plugin-accent',
        link: '--plugin-link', danger: '--plugin-danger', ok: '--plugin-ok' }
      for (const key in map) if (t[key]) r.style.setProperty(map[key], t[key])
      r.style.colorScheme = t.dark === false ? 'light' : 'dark'
    }
    const I18N = {
      'zh-CN': {
        title: '导入皮肤 / 披风', intro: '导入到你的个人纹理库；选择角色可同时应用。Mojang 会导入该账号公开的皮肤与披风。',
        tabMojang: 'Mojang 正版用户名', tabBlessing: 'Blessing 皮肤链接',
        username: '正版用户名', usernamePlaceholder: '例如 Notch',
        url: '皮肤详情页链接', urlPlaceholder: 'https://站点/skinlib/show/123',
        applyTo: '应用到角色（可选）', libraryOnly: '只导入纹理库',
        submit: '开始导入', requestFailed: '请求失败', done: '导入完成',
        skin: '皮肤', cape: '披风', applied: '（已应用）'
      },
      en: {
        title: 'Import skin / cape', intro: 'Imports into your private texture library; optionally apply it to a character. Mojang imports the public skin and cape of that account.',
        tabMojang: 'Mojang username', tabBlessing: 'Blessing skin URL',
        username: 'Mojang username', usernamePlaceholder: 'e.g. Notch',
        url: 'Skin detail URL', urlPlaceholder: 'https://site/skinlib/show/123',
        applyTo: 'Apply to character (optional)', libraryOnly: 'Import to library only',
        submit: 'Import', requestFailed: 'Request failed', done: 'Import complete',
        skin: 'Skin', cape: 'Cape', applied: ' (applied)'
      }
    }
    let lang = 'zh-CN'
    function t(key, vars) {
      let text = (I18N[lang] && I18N[lang][key]) || I18N['zh-CN'][key] || key
      if (vars) for (const k in vars) text = text.replace('{' + k + '}', vars[k])
      return text
    }
    function applyLocale(locale) {
      lang = I18N[locale] ? locale : 'zh-CN'
      document.documentElement.lang = lang
      document.title = t('title')
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')) })
      document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')) })
    }
    let hostOrigin = '*'
    let nonce = ''
    let seq = 0
    let mode = 'mojang'
    const pending = new Map()
    const $ = (id) => document.getElementById(id)
    let resizeObs = null
    function reportSize() {
      if (!nonce || window.innerWidth < 200) return
      const kids = [...document.body.children].filter((el) => !/^(SCRIPT|STYLE)$/.test(el.tagName))
      const bottom = kids.reduce((m, el) => Math.max(m, el.getBoundingClientRect().bottom), 0)
      const pad = parseFloat(getComputedStyle(document.body).paddingBottom) || 0
      const h = Math.ceil(bottom + pad)
      if (h > 0 && Math.abs(h - window.innerHeight) > 1) post('resize', { height: h })
    }

    function post(type, payload, id) {
      parent.postMessage({ v: 1, nonce, type, payload, id }, hostOrigin)
    }
    function request(method, path, body) {
      const id = String(++seq)
      return new Promise((resolve) => {
        pending.set(id, resolve)
        post('request', { method, path, body }, id)
      })
    }
    function show(el, text) {
      el.textContent = text
      el.hidden = !text
    }
    function setMode(next) {
      mode = next
      $('tab-mojang').classList.toggle('on', next === 'mojang')
      $('tab-blessing').classList.toggle('on', next === 'blessing')
      $('pane-mojang').classList.toggle('hidden', next !== 'mojang')
      $('pane-blessing').classList.toggle('hidden', next !== 'blessing')
      show($('msg'), '')
      show($('done'), '')
      $('result').hidden = true
    }

    async function loadPlayers() {
      const r = await request('GET', '/players')
      if (!r || r.status !== 200) return
      const sel = $('player')
      for (const p of (r.body.players || [])) {
        const opt = document.createElement('option')
        opt.value = String(p.id)
        opt.textContent = p.name + (p.uuid ? ' · ' + p.uuid.slice(0, 8) : '')
        sel.appendChild(opt)
      }
    }

    async function submit() {
      const playerId = Number($('player').value) || 0
      const path = mode === 'mojang' ? '/import/mojang' : '/import/blessing'
      const body = mode === 'mojang'
        ? { username: $('username').value.trim(), playerId }
        : { url: $('url').value.trim(), playerId }
      show($('msg'), '')
      show($('done'), '')
      $('result').hidden = true
      $('submit').disabled = true
      try {
        const r = await request('POST', path, body)
        if (!r) { show($('msg'), t('requestFailed')); return }
        if (r.status !== 200) {
          const b = r.body || {}
          show($('msg'), (b.message || b.error || ('HTTP ' + r.status)))
          return
        }
        const imported = (r.body && r.body.imported) || []
        const applied = (r.body && r.body.applied) || {}
        show($('done'), t('done'))
        const lines = imported.map((item) => t(item.type === 'cape' ? 'cape' : 'skin') + ' #' + item.textureId + (applied[item.type] ? t('applied') : ''))
        const pre = document.createElement('div')
        pre.textContent = lines.join('\n')
        const box = $('result')
        box.replaceChildren(pre)
        box.hidden = false
      } finally {
        $('submit').disabled = false
      }
    }

    $('tab-mojang').onclick = () => setMode('mojang')
    $('tab-blessing').onclick = () => setMode('blessing')
    $('submit').onclick = submit
    $('username').onkeydown = (e) => { if (e.key === 'Enter') submit() }
    $('url').onkeydown = (e) => { if (e.key === 'Enter') submit() }

    window.addEventListener('message', (e) => {
      const m = e.data
      if (!m || m.v !== 1) return
      if (m.type === 'init') {
        hostOrigin = (m.payload && m.payload.origin) || '*'
        nonce = m.nonce || ''
        applyLocale((m.payload && m.payload.locale) || 'zh-CN')
        applyTheme(m.payload && m.payload.theme)
        if (!resizeObs) { resizeObs = new ResizeObserver(reportSize); resizeObs.observe(document.body) }
        reportSize()
        loadPlayers()
      } else if (m.type === 'response') {
        const done = pending.get(m.id)
        if (done) { pending.delete(m.id); done(m.payload) }
      }
    })
    window.addEventListener('load', reportSize)
    window.parent.postMessage({ v: 1, type: 'ready' }, '*')
  </script>
</body>
</html>
