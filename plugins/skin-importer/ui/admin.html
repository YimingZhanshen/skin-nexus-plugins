<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>皮肤导入</title>
  <!-- SkinNexus · Copyright (C) 2026 SkinNexus contributors · AGPL-3.0 -->
  <style>
:root {
      color-scheme: dark;
      --plugin-bg: #101825;
      --plugin-panel: #16202e;
      --plugin-border: rgba(169, 138, 95, .24);
      --plugin-text: #e9edf1;
      --plugin-muted: #a8b4c3;
      --plugin-accent: #b0453a;
      --plugin-link: #67b7a0;
      --plugin-danger: #d9564c;
      --plugin-ok: #6fbf7d;
      --plugin-hover: rgba(233, 237, 241, .06);
    }
    * { box-sizing: border-box; }
    html { background: var(--plugin-panel); }
    body {
      margin: 0 auto; max-width: 760px; padding: 28px;
      background: var(--plugin-panel); color: var(--plugin-text);
      font-family: "Segoe UI", "Inter", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 15px; line-height: 1.65;
    }
    body.admin { max-width: 1080px; }
    h2 { margin: 0 0 8px; font-size: 22px; font-weight: 600; line-height: 1.3; }
    h3 { margin: 28px 0 10px; font-size: 17px; font-weight: 600; }
    p { margin: 0; }
    .muted { color: var(--plugin-muted); font-size: 13px; }
    label { display: block; margin-top: 14px; font-size: 14px; color: var(--plugin-muted); }
    input, select, textarea {
      width: 100%; padding: 10px 12px; margin-top: 6px;
      background: var(--plugin-bg); color: var(--plugin-text);
      border: 1px solid var(--plugin-border); border-radius: 6px; font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--plugin-link); outline-offset: 1px; }
    input[type="checkbox"] { width: auto; accent-color: var(--plugin-accent); }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }
    button { font: inherit; border-radius: 6px; cursor: pointer; }
    .primary { margin-top: 18px; background: var(--plugin-accent); color: #fff; border: 0; padding: 10px 18px; font-weight: 600; }
    .primary:disabled { opacity: .5; cursor: default; }
    .secondary { background: transparent; color: var(--plugin-text); border: 1px solid var(--plugin-border); padding: 8px 14px; }
    .secondary:hover { background: var(--plugin-hover); }
    .error { color: var(--plugin-danger); white-space: pre-wrap; margin-top: 12px; }
    .ok { color: var(--plugin-ok); white-space: pre-wrap; margin-top: 12px; }
    .result { margin-top: 14px; font-size: 14px; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 6px; margin: 18px 0 12px; }
    .tabs button { border: 1px solid var(--plugin-border); background: transparent; color: var(--plugin-muted); padding: 8px 14px; }
    .tabs button.on { border-color: var(--plugin-accent); color: var(--plugin-accent); }
    .table-wrap { overflow-x: auto; margin-top: 12px; }
    .table-wrap table { min-width: 680px; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--plugin-border); vertical-align: top; }
    tbody tr:hover { background: var(--plugin-hover); }
    .bar { height: 8px; background: var(--plugin-bg); margin-top: 6px; border-radius: 4px; overflow: hidden; }
    .bar > i { display: block; height: 8px; background: var(--plugin-accent); }
    button.small { padding: 4px 9px; margin: 2px; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; font-size: 14px; color: var(--plugin-text); }
    .check input { width: auto; margin-top: 3px; }
    @media (max-width: 640px) {
      body { padding: 20px; }
      .row { flex-wrap: wrap; }
      .row > * { min-width: 100%; }
    }
  </style>
</head>
<body class="admin">
  <h2 data-i18n="title">Blessing 批量收录</h2>
  <p class="muted" data-i18n="intro">按点赞从高到低抓取公开皮肤；上传者为当前管理员，名称会带来源。任务在后台运行，关闭页面不影响。</p>

  <label><span data-i18n="site">Blessing 站点</span><input id="origin" placeholder="https://skin.example.com" autocomplete="off" /></label>
  <div class="row">
    <label><span data-i18n="type">类型</span><select id="type"><option value="skin" data-i18n="skin">皮肤</option><option value="cape" data-i18n="cape">披风</option></select></label>
    <label><span data-i18n="fromPage">起始页</span><input id="fromPage" type="number" min="1" value="1" /></label>
    <label><span data-i18n="toPage">结束页</span><input id="toPage" type="number" min="1" value="1" /></label>
  </div>
  <label class="check"><input id="confirm" type="checkbox" /> <span data-i18n="confirm">我确认拥有该站点的抓取授权，并接受版权与来源标注责任</span></label>
  <button id="start" class="primary" data-i18n="start">开始批量导入</button>
  <div id="msg" class="error" hidden></div>
  <div id="done" class="ok" hidden></div>

  <h3 data-i18n="jobs">任务</h3>
  <div class="row" style="align-items:center;">
    <button id="refresh" class="secondary" style="flex:0 0 auto;" data-i18n="refresh">刷新</button>
    <span id="counts" class="muted"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th data-i18n="colJob">任务</th><th data-i18n="colState">状态</th><th data-i18n="colProgress">进度</th><th data-i18n="colCounts">统计</th><th data-i18n="colActions">操作</th></tr></thead>
      <tbody id="jobs"></tbody>
    </table>
  </div>

  <script>
function applyTheme(t) {
      if (!t) return
      const r = document.documentElement
      const map = { bg: '--plugin-bg', panel: '--plugin-panel', border: '--plugin-border',
        text: '--plugin-text', muted: '--plugin-muted', accent: '--plugin-accent',
        link: '--plugin-link', danger: '--plugin-danger', ok: '--plugin-ok' }
      for (const key in map) if (t[key]) r.style.setProperty(map[key], t[key])
      r.style.colorScheme = t.dark === false ? 'light' : 'dark'
    }
    const I18N = {
      'zh-CN': {
        title: 'Blessing 批量收录', intro: '按点赞从高到低抓取公开皮肤；上传者为当前管理员，名称会带来源。任务在后台运行，关闭页面不影响。',
        site: 'Blessing 站点', type: '类型', skin: '皮肤', cape: '披风', fromPage: '起始页', toPage: '结束页',
        confirm: '我确认拥有该站点的抓取授权，并接受版权与来源标注责任', start: '开始批量导入',
        jobs: '任务', refresh: '刷新', colJob: '任务', colState: '状态', colProgress: '进度', colCounts: '统计', colActions: '操作',
        cancel: '取消', resume: '恢复', loadFailed: '任务列表加载失败', actionFailed: '操作失败', submitted: '任务已提交：{id}',
        count: '共 {n} 个任务', imported: '导入', duplicate: '重复', skipped: '跳过', failed: '失败',
        queued: '排队中', running: '运行中', cancelling: '取消中', cancelled: '已取消', paused: '已暂停', done: '已完成'
      },
      en: {
        title: 'Blessing batch import', intro: 'Crawl public skins by likes; imports are uploaded by the current admin and tagged with their source. Jobs run in the background.',
        site: 'Blessing site', type: 'Type', skin: 'Skin', cape: 'Cape', fromPage: 'From page', toPage: 'To page',
        confirm: 'I confirm I am authorized to crawl this site and accept copyright/source attribution responsibility.', start: 'Start import',
        jobs: 'Jobs', refresh: 'Refresh', colJob: 'Job', colState: 'State', colProgress: 'Progress', colCounts: 'Stats', colActions: 'Actions',
        cancel: 'Cancel', resume: 'Resume', loadFailed: 'Failed to load jobs', actionFailed: 'Action failed', submitted: 'Job submitted: {id}',
        count: '{n} jobs', imported: 'imported', duplicate: 'duplicates', skipped: 'skipped', failed: 'failed',
        queued: 'queued', running: 'running', cancelling: 'cancelling', cancelled: 'cancelled', paused: 'paused', done: 'done'
      }
    }
    let lang = 'zh-CN'
    function t(key, vars) {
      let text = (I18N[lang] && I18N[lang][key]) || I18N['zh-CN'][key] || key
      if (vars) for (const k in vars) text = text.replace('{' + k + '}', vars[k])
      return text
    }
    function applyLocale(locale) {
      lang = I18N[locale] ? locale : 'zh-CN'
      document.documentElement.lang = lang
      document.title = t('title')
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')) })
    }
    let hostOrigin = '*'
    let nonce = ''
    let seq = 0
    const pending = new Map()
    const $ = (id) => document.getElementById(id)
    let resizeObs = null
    function reportSize() {
      if (!nonce || window.innerWidth < 200) return
      const kids = [...document.body.children].filter((el) => !/^(SCRIPT|STYLE)$/.test(el.tagName))
      const bottom = kids.reduce((m, el) => Math.max(m, el.getBoundingClientRect().bottom), 0)
      const pad = parseFloat(getComputedStyle(document.body).paddingBottom) || 0
      const h = Math.ceil(bottom + pad)
      if (h > 0 && Math.abs(h - window.innerHeight) > 1) post('resize', { height: h })
    }
    const active = new Set(['queued', 'running', 'cancelling', 'paused'])

    function post(type, payload, id) {
      parent.postMessage({ v: 1, nonce, type, payload, id }, hostOrigin)
    }
    function request(method, path, body) {
      const id = String(++seq)
      return new Promise((resolve) => {
        pending.set(id, resolve)
        post('request', { method, path, body }, id)
      })
    }
    function show(el, text) { el.textContent = text; el.hidden = !text }
    function jobLabel(j) {
      const p = j.payload || {}
      return j.handler + ' · ' + (p.type || 'skin') + ' ' + (p.fromPage || '?') + '–' + (p.toPage || '?')
    }
    function draw(jobs) {
      const body = $('jobs')
      body.replaceChildren()
      for (const j of jobs) {
        const tr = document.createElement('tr')
        const state = j.state || ''
        const c = (j.result && typeof j.result === 'object') ? j.result : (j.cursor && j.cursor.counts) || {}
        const counts = t('imported') + ' ' + (c.imported || 0) + ' / ' + t('duplicate') + ' ' + ((c.duplicatePublic || 0) + (c.duplicateOwn || 0)) + ' / ' + t('skipped') + ' ' + (c.skipped || 0) + (c.failed ? ' / ' + t('failed') + ' ' + c.failed : '')
        const pct = Number(j.progress || 0)
        tr.innerHTML =
          '<td><div>' + jobLabel(j) + '</div><div class="muted">' + (j.id || '') + '</div></td>' +
          '<td>' + (I18N[lang][state] || state) + (j.lastError ? '<div class="error">' + j.lastError + '</div>' : '') + '</td>' +
          '<td>' + pct + '%<div class="bar"><i style="width:' + pct + '%"></i></div><div class="muted">' + (j.message || '') + '</div></td>' +
          '<td>' + counts + '</td>' +
          '<td></td>'
        const actions = tr.lastElementChild
        if (state === 'queued' || state === 'running' || state === 'cancelling' || state === 'paused') {
          const b = document.createElement('button'); b.className = 'small secondary'; b.textContent = t('cancel')
          b.onclick = () => act(j.id, 'cancel'); actions.appendChild(b)
        }
        if (state === 'cancelled' || state === 'failed' || state === 'paused') {
          const b = document.createElement('button'); b.className = 'small secondary'; b.textContent = t('resume')
          b.onclick = () => act(j.id, 'resume'); actions.appendChild(b)
        }
        body.appendChild(tr)
      }
    }
    async function load() {
      const r = await request('GET', '/admin/jobs')
      if (!r || r.status !== 200) { show($('msg'), t('loadFailed')); return }
      const jobs = (r.body && r.body.jobs) || []
      $('counts').textContent = t('count', { n: (r.body && r.body.total) || jobs.length })
      draw(jobs)
      if (jobs.some((j) => active.has(j.state))) setTimeout(load, 2000)
    }
    async function act(id, action) {
      const r = await request('POST', '/admin/jobs/' + encodeURIComponent(id) + '/' + action)
      if (!r || r.status !== 200) { show($('msg'), t('actionFailed')); return }
      show($('msg'), ''); load()
    }
    async function start() {
      show($('msg'), ''); show($('done'), '')
      const body = {
        origin: $('origin').value.trim(),
        type: $('type').value,
        fromPage: Number($('fromPage').value),
        toPage: Number($('toPage').value),
        confirm: $('confirm').checked
      }
      $('start').disabled = true
      try {
        const r = await request('POST', '/admin/batch', body)
        if (!r || r.status !== 200) {
          const b = (r && r.body) || {}
          show($('msg'), b.message || b.error || ('HTTP ' + (r ? r.status : '?')))
          return
        }
        show($('done'), t('submitted', { id: r.body.jobId }))
        await load()
      } finally { $('start').disabled = false }
    }
    $('start').onclick = start
    $('refresh').onclick = load
    window.addEventListener('message', (e) => {
      const m = e.data
      if (!m || m.v !== 1) return
      if (m.type === 'init') {
        hostOrigin = (m.payload && m.payload.origin) || '*'
        nonce = m.nonce || ''
        applyLocale((m.payload && m.payload.locale) || 'zh-CN')
        applyTheme(m.payload && m.payload.theme)
        if (!resizeObs) { resizeObs = new ResizeObserver(reportSize); resizeObs.observe(document.body) }
        reportSize()
        load()
      } else if (m.type === 'response') {
        const done = pending.get(m.id)
        if (done) { pending.delete(m.id); done(m.payload) }
      }
    })
    window.addEventListener('load', reportSize)
    window.parent.postMessage({ v: 1, type: 'ready' }, '*')
  </script>
</body>
</html>
