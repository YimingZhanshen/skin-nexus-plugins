<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provenance</title>
  <!-- SkinNexus · Copyright (C) 2026 SkinNexus contributors · AGPL-3.0 -->
  <style>
:root {
      color-scheme: dark;
      --plugin-bg: #101825;
      --plugin-panel: #16202e;
      --plugin-border: rgba(169, 138, 95, .24);
      --plugin-text: #e9edf1;
      --plugin-muted: #a8b4c3;
      --plugin-accent: #b0453a;
      --plugin-link: #67b7a0;
      --plugin-danger: #d9564c;
      --plugin-ok: #6fbf7d;
    }
    * { box-sizing: border-box; }
    html { background: var(--plugin-panel); }
    body {
      margin: 0; padding: 20px; background: var(--plugin-panel); color: var(--plugin-text);
      font-family: "Segoe UI", "Inter", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.65;
    }
    .muted { color: var(--plugin-muted); font-size: 13px; }
    h4 { margin: 0 0 8px; font-size: 14px; color: var(--plugin-muted); font-weight: 600; }
    .row { margin: 6px 0; font-size: 14px; }
    .error { color: var(--plugin-danger); }

  </style>
</head>
<body>
  <h4 id="heading">纹理来源</h4>
  <div id="body" class="muted">加载中…</div>
  <script>
    const THEME_MAP = { bg: '--plugin-bg', panel: '--plugin-panel', border: '--plugin-border',
      text: '--plugin-text', muted: '--plugin-muted', accent: '--plugin-accent',
      link: '--plugin-link', danger: '--plugin-danger', ok: '--plugin-ok' }
    function applyTheme(theme) {
      if (!theme) return
      const root = document.documentElement
      for (const key in THEME_MAP) if (theme[key]) root.style.setProperty(THEME_MAP[key], theme[key])
      root.style.colorScheme = theme.dark === false ? 'light' : 'dark'
    }

    var hash = new URLSearchParams(location.search).get('hash') || ''
    var hostOrigin = '*'
    var nonce = ''
    var seq = 0
    var pending = new Map()
    var body = document.getElementById('body')
    var heading = document.getElementById('heading')
    var I18N = {
      'zh-CN': { title: '纹理来源', heading: '纹理来源', loading: '加载中…', none: '暂无来源信息', source: '来源：{v}', credit: '署名：{v}', self: '本人制作', other: '转载', commission: '约稿', unset: '未填写' },
      en: { title: 'Texture provenance', heading: 'Texture provenance', loading: 'Loading…', none: 'No provenance recorded', source: 'Source: {v}', credit: 'Credit: {v}', self: 'Creator', other: 'Repost', commission: 'Commissioned', unset: 'Not set' }
    }
    var lang = 'zh-CN'
    function t(key, vars) {
      var text = (I18N[lang] && I18N[lang][key]) || I18N['zh-CN'][key] || key
      if (vars) for (var k in vars) text = text.replace('{' + k + '}', vars[k])
      return text
    }
    function applyLocale(locale) {
      lang = I18N[locale] ? locale : 'zh-CN'
      document.documentElement.lang = lang
      document.title = t('title')
      heading.textContent = t('heading')
      if (!body.dataset.loaded) body.textContent = t('loading')
    }

    function request(path) {
      var id = String(++seq)
      return new Promise(function (resolve) {
        pending.set(id, resolve)
        parent.postMessage({ v: 1, nonce: nonce, type: 'request', payload: { method: 'GET', path: path }, id: id }, hostOrigin)
      })
    }

    function render(r) {
      body.dataset.loaded = '1'
      if (!r || r.status !== 200) {
        body.textContent = t('none')
        return
      }
      var src = t(r.body.source) !== r.body.source ? t(r.body.source) : (r.body.source || t('unset'))
      body.innerHTML = ''
      var a = document.createElement('div'); a.className = 'row'; a.textContent = t('source', { v: src })
      body.appendChild(a)
      if (r.body.credit) {
        var b = document.createElement('div'); b.className = 'row'; b.textContent = t('credit', { v: r.body.credit })
        body.appendChild(b)
      }
    }

    window.addEventListener('message', function (e) {
      var m = e.data
      if (!m || m.v !== 1) return
      if (m.type === 'init') {
        hostOrigin = (m.payload && m.payload.origin) || '*'
        nonce = m.nonce || ''
        applyLocale((m.payload && m.payload.locale) || 'zh-CN')
        applyTheme(m.payload && m.payload.theme)
        startResize()
        if (hash) request('/provenance/' + encodeURIComponent(hash)).then(render)
        else { body.dataset.loaded = '1'; body.textContent = t('none') }
      } else if (m.type === 'response') {
        var done = pending.get(m.id)
        if (done) { pending.delete(m.id); done(m.payload) }
      }
    })
    let resizeObs = null
    function startResize() {
      if (resizeObs) return
      const report = () => {
        if (!nonce || window.innerWidth < 200) return
        const kids = [...document.body.children].filter((el) => !/^(SCRIPT|STYLE)$/.test(el.tagName))
        const bottom = kids.reduce((m, el) => Math.max(m, el.getBoundingClientRect().bottom), 0)
        const pad = parseFloat(getComputedStyle(document.body).paddingBottom) || 0
        const h = Math.ceil(bottom + pad)
        if (h > 0 && Math.abs(h - window.innerHeight) > 1) parent.postMessage({ v: 1, nonce, type: 'resize', payload: { height: h } }, hostOrigin)
      }
      resizeObs = new ResizeObserver(report)
      resizeObs.observe(document.body)
      report()
    }
    parent.postMessage({ v: 1, type: 'ready' }, '*')
  </script>
</body>
</html>
