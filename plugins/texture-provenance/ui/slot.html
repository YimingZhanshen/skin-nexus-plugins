<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provenance</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px 16px; color: #222; }
    h4 { margin: 0 0 6px; font-size: 13px; color: #666; }
    .row { margin: 4px 0; font-size: 13px; }
    .muted { color: #777; font-size: 12px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h4>纹理来源</h4>
  <div id="body" class="muted">加载中…</div>
  <script>
    var hash = new URLSearchParams(location.search).get('hash') || ''
    var hostOrigin = '*'
    var nonce = ''
    var seq = 0
    var pending = new Map()
    var body = document.getElementById('body')

    function request(path) {
      var id = String(++seq)
      return new Promise(function (resolve) {
        pending.set(id, resolve)
        parent.postMessage({ v: 1, nonce: nonce, type: 'request', payload: { method: 'GET', path: path }, id: id }, hostOrigin)
      })
    }

    function render(r) {
      if (!r || r.status !== 200) {
        body.textContent = '暂无来源信息'
        return
      }
      var labels = { self: '本人制作', other: '转载', commission: '约稿' }
      var src = labels[r.body.source] || r.body.source || '未填写'
      body.innerHTML = ''
      var a = document.createElement('div'); a.className = 'row'; a.textContent = '来源：' + src
      body.appendChild(a)
      if (r.body.credit) {
        var b = document.createElement('div'); b.className = 'row'; b.textContent = '署名：' + r.body.credit
        body.appendChild(b)
      }
    }

    window.addEventListener('message', function (e) {
      var m = e.data
      if (!m || m.v !== 1) return
      if (m.type === 'init') {
        hostOrigin = (m.payload && m.payload.origin) || '*'
        nonce = m.nonce || ''
        if (hash) request('/provenance/' + encodeURIComponent(hash)).then(render)
        else body.textContent = '暂无来源信息'
      } else if (m.type === 'response') {
        var done = pending.get(m.id)
        if (done) { pending.delete(m.id); done(m.payload) }
      }
    })
    parent.postMessage({ v: 1, type: 'ready' }, '*')
  </script>
</body>
</html>
