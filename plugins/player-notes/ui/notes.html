<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes</title>
  <!-- SkinNexus · Copyright (C) 2026 SkinNexus contributors · AGPL-3.0 -->
  <style>
:root {
      color-scheme: dark;
      --plugin-bg: #101825;
      --plugin-panel: #16202e;
      --plugin-border: rgba(169, 138, 95, .24);
      --plugin-text: #e9edf1;
      --plugin-muted: #a8b4c3;
      --plugin-accent: #b0453a;
      --plugin-link: #67b7a0;
      --plugin-danger: #d9564c;
      --plugin-ok: #6fbf7d;
    }
    * { box-sizing: border-box; }
    html { background: var(--plugin-panel); }
    body {
      margin: 0; padding: 20px; background: var(--plugin-panel); color: var(--plugin-text);
      font-family: "Segoe UI", "Inter", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.65;
    }
    .muted { color: var(--plugin-muted); font-size: 13px; }
    textarea {
      width: 100%; min-height: 110px; padding: 10px 12px;
      background: var(--plugin-bg); color: var(--plugin-text);
      border: 1px solid var(--plugin-border); border-radius: 6px; font: inherit;
    }
    textarea:focus { outline: 2px solid var(--plugin-link); outline-offset: 1px; }
    ul { padding-left: 20px; }
    .error { color: var(--plugin-danger); }
    button { background: var(--plugin-accent); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; }

  </style>
</head>
<body>
  <p class="muted" data-i18n="intro">数据存在插件命名空间里，通过宿主的 session 路由读写。</p>
  <textarea id="text" data-i18n-placeholder="placeholder" placeholder="写一条笔记…"></textarea>
  <p><button id="add" data-i18n="save">保存</button> <span id="msg" class="muted"></span></p>
  <ul id="list"></ul>
  <script>
    const THEME_MAP = { bg: '--plugin-bg', panel: '--plugin-panel', border: '--plugin-border',
      text: '--plugin-text', muted: '--plugin-muted', accent: '--plugin-accent',
      link: '--plugin-link', danger: '--plugin-danger', ok: '--plugin-ok' }
    function applyTheme(theme) {
      if (!theme) return
      const root = document.documentElement
      for (const key in THEME_MAP) if (theme[key]) root.style.setProperty(THEME_MAP[key], theme[key])
      root.style.colorScheme = theme.dark === false ? 'light' : 'dark'
    }

    let hostOrigin = '*'
    let nonce = ''
    let seq = 0
    const pending = new Map()
    const msg = document.getElementById('msg')
    const I18N = {
      'zh-CN': { title: '角色笔记', intro: '数据存在插件命名空间里，通过宿主的 session 路由读写。', placeholder: '写一条笔记…', save: '保存', loadingFailed: '加载失败', saved: '已保存', saveFailed: '保存失败（{status}）' },
      en: { title: 'Player notes', intro: 'Notes live in the plugin namespace and are read through the host session routes.', placeholder: 'Write a note…', save: 'Save', loadingFailed: 'Failed to load', saved: 'Saved', saveFailed: 'Save failed ({status})' }
    }
    let lang = 'zh-CN'
    function t(key, vars) {
      let text = (I18N[lang] && I18N[lang][key]) || I18N['zh-CN'][key] || key
      if (vars) for (const k in vars) text = text.replace('{' + k + '}', vars[k])
      return text
    }
    function applyLocale(locale) {
      lang = I18N[locale] ? locale : 'zh-CN'
      document.documentElement.lang = lang
      document.title = t('title')
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')) })
      document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')) })
    }

    function post(type, payload, id) {
      parent.postMessage({ v: 1, nonce, type, payload, id }, hostOrigin)
    }
    function request(method, path, body) {
      const id = String(++seq)
      return new Promise((resolve) => {
        pending.set(id, resolve)
        post('request', { method, path, body }, id)
      })
    }
    async function load() {
      const r = await request('GET', '/notes')
      const list = document.getElementById('list')
      list.innerHTML = ''
      if (!r || r.status !== 200) { msg.textContent = t('loadingFailed'); return }
      for (const item of (r.body.items || [])) {
        const li = document.createElement('li')
        li.textContent = item.doc.text
        list.appendChild(li)
      }
    }
    document.getElementById('add').onclick = async () => {
      const text = document.getElementById('text').value.trim()
      if (!text) return
      const r = await request('POST', '/notes', { text })
      if (r && r.status === 200) {
        document.getElementById('text').value = ''
        msg.textContent = t('saved')
        await load()
      } else {
        msg.textContent = t('saveFailed', { status: r ? r.status : '?' })
      }
    }
    window.addEventListener('message', (e) => {
      const m = e.data
      if (!m || m.v !== 1) return
      if (m.type === 'init') {
        hostOrigin = (m.payload && m.payload.origin) || '*'
        nonce = m.nonce || ''
        applyLocale((m.payload && m.payload.locale) || 'zh-CN')
        applyTheme(m.payload && m.payload.theme)
        startResize()
        load()
      } else if (m.type === 'response') {
        const done = pending.get(m.id)
        if (done) { pending.delete(m.id); done(m.payload) }
      }
    })
    let resizeObs = null
    function startResize() {
      if (resizeObs) return
      const report = () => {
        if (!nonce || window.innerWidth < 200) return
        const kids = [...document.body.children].filter((el) => !/^(SCRIPT|STYLE)$/.test(el.tagName))
        const bottom = kids.reduce((m, el) => Math.max(m, el.getBoundingClientRect().bottom), 0)
        const pad = parseFloat(getComputedStyle(document.body).paddingBottom) || 0
        const h = Math.ceil(bottom + pad)
        if (h > 0 && Math.abs(h - window.innerHeight) > 1) parent.postMessage({ v: 1, nonce, type: 'resize', payload: { height: h } }, hostOrigin)
      }
      resizeObs = new ResizeObserver(report)
      resizeObs.observe(document.body)
      report()
    }

    window.parent.postMessage({ v: 1, type: 'ready' }, '*')
  </script>
</body>
</html>
