name: Plugin PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout server tooling
        uses: actions/checkout@v4
        with:
          repository: YimingZhanshen/skin-nexus
          ref: ${{ vars.SKIN_SERVER_REF || 'main' }}
          path: .server

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build skin-plugin
        run: |
          cd .server/server
          go build -o "$RUNNER_TEMP/skin-plugin" ./cmd/skin-plugin

      - name: Lint changed plugins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOST_VERSION: ${{ vars.SKIN_HOST_VERSION || '0.4.0' }}
        run: |
          set -euo pipefail
          names="$(git diff --name-only "$BASE_SHA" HEAD -- plugins | awk -F/ 'NF>1 {print $2}' | sort -u)"
          if [[ -z "$names" ]]; then
            echo "no plugin changes"
            exit 0
          fi
          failed=0
          for name in $names; do
            if [[ ! -d "plugins/$name" ]]; then
              echo "removed: $name (registry will drop it after signing)"
              continue
            fi
            echo "== $name"
            "$RUNNER_TEMP/skin-plugin" lint \
              --dir "plugins/$name" \
              --registry v1/registry.json \
              --host-version "$HOST_VERSION" \
              --json || failed=1
          done
          exit "$failed"

      - name: Reject private keys and binaries
        run: |
          set -euo pipefail
          if grep -rIl --exclude-dir=.git "BEGIN PRIVATE KEY" plugins; then
            echo "private key material found under plugins/" >&2
            exit 1
          fi
          if find plugins -type f \( -name '*.pem' -o -name '*.key' -o -name '*.exe' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) | grep .; then
            echo "key/binary files are not allowed under plugins/" >&2
            exit 1
          fi
          echo "source hygiene ok"
